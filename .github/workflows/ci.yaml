name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  neutrality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tracked files must not carry real addresses, hostnames, home directories,
      # private keys or vault names. The rules are deliberately shape-based: a
      # literal denylist living in this repository would itself be the leak.
      # See CONTRIBUTING.md「中性化约定」.
      - name: Check tracked files for non-neutralized real values
        run: bash scripts/check-neutrality.sh

  lint:
    runs-on: ubuntu-latest
    needs: neutrality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
      - name: Run golangci-lint
        run: |
          $(go env GOPATH)/bin/golangci-lint run -v

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: CGO_ENABLED=0 go build -o bin/opspulse ./cmd/opspulse
      - uses: actions/upload-artifact@v4
        with:
          name: opspulse-linux-amd64
          path: bin/

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      # The 1Password flows cannot be unit-tested: `op` needs an interactive
      # Desktop App approval, so scripts/verify-onepassword.sh drives a stub CLI
      # instead and asserts on the exact call sequence. It builds its own binary,
      # so it does not depend on the artifact above.
      - name: Verify ops 1p backup/restore end to end
        run: bash scripts/verify-onepassword.sh
