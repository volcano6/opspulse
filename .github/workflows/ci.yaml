name: CI

# 门禁的唯一事实源是 Makefile：下面每个 job 都只调用一个 make 目标，
# 本文件里**不写任何具体命令**。CI 的 job 集合与 `make ci` 的依赖集合
# 一一对应；两边都从 Makefile 读取具体命令。
# 要新增/修改检查项时改 Makefile（以及 `ci` 目标的依赖列表），不要在这里内联命令——
# 历史上 CI 与 scripts/ci.sh 各有一份命令，两边很快就漂移成了两套闸门。
#
# 触发面：main 的 push/PR。项目不维护版本 tag 或官方二进制发行。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref 的新 push 取消仍在跑的旧运行，避免互相抢 runner。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 已跟踪文件不得携带真实地址/域名/家目录/私钥/库名（规则见 scripts/check-neutrality.sh）。
  neutrality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Neutrality gate
        run: make neutrality

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: gofmt check
        run: make fmt-check

  # 唯一的 lint 实现（golangci-lint + .golangci.yml，版本 pin 在 Makefile）。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Lint
        run: make lint

  # 文档门禁：cli.md 生成物与命令树逐字节一致、相对链接与页内锚点可解析、文档里出现的
  # 命令与 flag 都能在命令树里解析、命令树里每条命令都在手写文档里露过面
  # （断言见 cmd/opspulse/{cli_reference,docs_check}_test.go，版本无关）。
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Docs check
        run: make docs-check

  # linux/darwin/windows 三个 GOOS 的 vet：Windows/macOS 专属文件在 linux 上会被
  # build tag 排除，只有换 GOOS 才会被类型检查到。
  vet-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Cross-platform vet
        run: make vet-cross

  # `make cover` 依赖 `make test`：同一条 `go test -race -coverprofile` 命令既跑测试
  # 又产覆盖率，再对总覆盖率卡阈值。所以这里不需要再单开一个 test job
  # （本地 `make ci` 同样只跑一遍）。
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Race tests + coverage threshold
        run: make cover
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out

  # 依赖漏洞扫描（govulncheck，版本 pin 在 Makefile）。有漏洞即失败。
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Vulnerability scan
        run: make vuln

  # 三平台交叉构建：只证明 linux/darwin/windows 都能编译，不上传可下载发行包。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Cross build
        run: make build-cross

  # 1Password 备份/还原的离线端到端：真实 `op` 需要桌面端交互授权，CI 里无法驱动，
  # 因此它用 scripts/opstub 这个 stub CLI 断言调用序列（脚本自己构建二进制）。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: 1Password offline E2E
        run: make e2e

  # Dockerfile 真的能构建（否则一个没人验证的产物只会长期腐烂），
  # 同时验证 make docker 的版本注入 build-arg 链路。
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Build image
        run: make docker
