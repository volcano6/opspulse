name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布门禁：tag 可以指向任意 commit，所以发版前必须把完整的 `make ci` 跑一遍
  # （与 CI 各 job 调用的同一批 make 目标，不另写一套命令）。
  gate:
    name: Pre-release gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run full gate
        run: make ci

  release:
    name: Build and Release
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binaries for multiple platforms
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS="${PLATFORM%/*}"
            GOARCH="${PLATFORM#*/}"
            BIN_NAME="opspulse"
            ARCHIVE_NAME="opspulse-${TAG_NAME}-${GOOS}-${GOARCH}"

            if [ "$GOOS" = "windows" ]; then
              BIN_NAME="opspulse.exe"
            fi

            OUTPUT_DIR="build/${GOOS}_${GOARCH}"
            mkdir -p "$OUTPUT_DIR"

            echo "Building $GOOS/$GOARCH..."
            # -trimpath：发行包不得内嵌构建机的绝对路径（go version -m 与 panic 栈都能读出）。
            # 与 Makefile / Dockerfile 保持一致。
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath \
              -ldflags "-s -w \
                -X github.com/volcano6/opspulse/internal/version.Version=${TAG_NAME} \
                -X github.com/volcano6/opspulse/internal/version.Commit=${COMMIT} \
                -X github.com/volcano6/opspulse/internal/version.Date=${BUILD_DATE}" \
              -o "${OUTPUT_DIR}/${BIN_NAME}" \
              ./cmd/opspulse

            # Package archive with README and LICENSE
            cp README.md LICENSE "${OUTPUT_DIR}/" 2>/dev/null || true
            if [ "$GOOS" = "windows" ]; then
              (cd "$OUTPUT_DIR" && zip -q -r "../../dist/${ARCHIVE_NAME}.zip" .)
            else
              tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C "$OUTPUT_DIR" .
            fi
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Compose release notes
        run: |
          {
            printf '## 安装\n\n'
            printf '从本页附件下载对应平台的压缩包（linux / darwin / windows × amd64 / arm64），\n'
            printf '按同页 `checksums.txt` 校验后解压即用；具体步骤见 README 的「安装 (Install)」章节。\n\n'
            # 变更记录与 CHANGELOG.md 同源：都由 conventional commit 推导。
            # 不用 generate_release_notes —— 它只列 PR，直推 main 的提交会整段漏掉。
            if [ "${GITHUB_REF_NAME}" = v* ]; then
              bash scripts/gen-changelog.sh --version "${GITHUB_REF_NAME#v}"
            else
              bash scripts/gen-changelog.sh
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          # 区间推导一旦出错（例如起点取成了本次 tag 自己）body 会静默退化成一句
          # 「本次区间没有提交」，发出去就是一份没有变更记录的 release。
          if grep -q '本次区间没有' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::变更区间为空，release body 退化成占位句；检查 scripts/gen-changelog.sh 的区间起点" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
