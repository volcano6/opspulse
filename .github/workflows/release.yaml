name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binaries for multiple platforms
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS="${PLATFORM%/*}"
            GOARCH="${PLATFORM#*/}"
            BIN_NAME="opspulse"
            ARCHIVE_NAME="opspulse-${TAG_NAME}-${GOOS}-${GOARCH}"

            if [ "$GOOS" = "windows" ]; then
              BIN_NAME="opspulse.exe"
            fi

            OUTPUT_DIR="build/${GOOS}_${GOARCH}"
            mkdir -p "$OUTPUT_DIR"

            echo "Building $GOOS/$GOARCH..."
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -ldflags "-s -w \
                -X github.com/volcano6/opspulse/internal/version.Version=${TAG_NAME} \
                -X github.com/volcano6/opspulse/internal/version.Commit=${COMMIT} \
                -X github.com/volcano6/opspulse/internal/version.Date=${BUILD_DATE}" \
              -o "${OUTPUT_DIR}/${BIN_NAME}" \
              ./cmd/opspulse

            # Package archive with README and LICENSE
            cp README.md LICENSE "${OUTPUT_DIR}/" 2>/dev/null || true
            if [ "$GOOS" = "windows" ]; then
              (cd "$OUTPUT_DIR" && zip -q -r "../../dist/${ARCHIVE_NAME}.zip" .)
            else
              tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C "$OUTPUT_DIR" .
            fi
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
