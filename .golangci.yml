# OpsPulse GolangCI-Lint Configuration
# Aligns GitHub Actions linting with local verification standards

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - errcheck
    - gofmt
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  errcheck:
    check-type-assertions: false
    check-blank: false
  gosec:
    excludes:
      - G106 # InsecureIgnoreHostKey for automated VPS bootstrapping
      - G204 # Subprocess command execution (script runner core capability)
      - G304 # File paths from user config / CLI args
      - G703 # Path traversal sanitization handled by custom validation

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - docs
    - bin
    - dist
    - scratch
    - .gemini
    - .workbuddy
    - .workbuddy-ai
  exclude-rules:
    # Relax error checking and security checks in test files
    - path: _test\.go
      linters:
        - errcheck
        - gosec
