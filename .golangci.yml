# OpsPulse GolangCI-Lint Configuration
# Keep this schema on v1 while Makefile pins golangci-lint v1.64.x. The v2
# config format is intentionally not used here: v2 also enables a different
# default analyzer set, which must be reviewed as its own migration.
run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gofmt
    - gosimple
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  errcheck:
    check-type-assertions: false
    check-blank: false
  gosec:
    excludes:
      - G106 # InsecureIgnoreHostKey for automated VPS bootstrapping
      - G204 # Subprocess command execution (script runner core capability)
      - G304 # File paths from user config / CLI args
      - G703 # Path traversal sanitization handled by custom validation

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - docs
    - bin
    - dist
    - scratch
    - .gemini
    - .workbuddy
    - .workbuddy-ai
    - .trellis
  exclude-rules:
    # Relax error checking and security checks in test files.
    - path: _test\.go
      linters:
        - errcheck
        - gosec
